name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Determinism gate: pure stub-path vitest, no DB needed.
      - run: npm test

  db:
    runs-on: ubuntu-latest
    # Expose the project ref at job level so the prod-push step's `if:` can guard
    # on it. The `secrets` context is NOT available in step-level conditionals
    # (nor is a step's own `env:`), so the guard must read it via the job `env`.
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pin to the version resolved in package-lock.json (devDep supabase
          # ^2.23.4) so CI and local dev run the same CLI; bump deliberately
          # alongside the lockfile.
          version: 2.98.2
      # Boot a local Postgres + apply all migrations from supabase/migrations/.
      - run: supabase db start
      # Fail the job on lint errors AND warnings (catches duplicate function
      # defs, missing security invoker, syntax errors before merge).
      - run: supabase db lint --level warning
      # Run the pgTAP suite under supabase/tests/ (the RLS contract test).
      - run: supabase test db
      # On merge to master only: apply pending migrations to the prod project
      # before any deploy. Requires repo secrets (see README "CI"). Guarded on
      # env.SUPABASE_PROJECT_REF so it SKIPS cleanly (instead of red-failing)
      # when the deploy secrets are absent — e.g. forks, or before prod secrets
      # are configured.
      - name: Push migrations to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && env.SUPABASE_PROJECT_REF != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --linked
